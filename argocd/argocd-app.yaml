apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopmesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Atharv22-ak/shopmesh.git   # <- apni new repo ka URL
    targetRevision: main
    path: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: shopmesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
