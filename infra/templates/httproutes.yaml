{{- /*
All external routes in one place (Gateway API). Gateway name/namespace/domain
come from the single `gateway:` block; each route only adds a subdomain.
*/}}
{{- $gw := .Values.gateway }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.route $svc.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "shopmesh.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  hostnames:
    - {{ include "shopmesh.host" (dict "sub" $svc.route.subdomain "root" $) | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $svc.route.path | default "/" }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $svc.port }}
---
{{- end }}
{{- end }}
{{- if .Values.rabbitmq.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  hostnames:
    - {{ include "shopmesh.host" (dict "sub" .Values.rabbitmq.route.subdomain "root" $) | quote }}
  rules:
    - backendRefs:
        - name: rabbitmq-management
          port: 15672
{{- end }}
