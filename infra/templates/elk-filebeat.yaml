{{- if and .Values.elk.enabled .Values.elk.filebeat.enabled }}
{{- $fb := .Values.elk.filebeat }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-filebeat
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-filebeat
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: filebeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/part-of: shopmesh-elk
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/elk-filebeat-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:{{ .Values.elk.version }}
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          securityContext:
            runAsUser: 0
          resources:
            {{- toYaml $fb.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true }
            - { name: data, mountPath: /usr/share/filebeat/data }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            {{- if $fb.mountDockerLogs }}
            - { name: dockerlogs, mountPath: /var/lib/docker/containers, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: data
          hostPath:
            path: /var/lib/filebeat-{{ .Release.Namespace }}-{{ .Release.Name }}
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
        {{- if $fb.mountDockerLogs }}
        - name: dockerlogs
          hostPath:
            path: /var/lib/docker/containers
        {{- end }}
{{- end }}
