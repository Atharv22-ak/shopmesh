{{- if and .Values.elk.enabled .Values.elk.elasticsearch.enabled }}
{{- $es := .Values.elk.elasticsearch }}
{{- if $es.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if $es.persistence.storageClassName }}
  storageClassName: {{ $es.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $es.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: shopmesh-elk
    spec:
      securityContext:
        fsGroup: 1000
      {{- if $es.sysctlInit }}
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      {{- end }}
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:{{ .Values.elk.version }}
          ports:
            - containerPort: 9200
          env:
            - { name: cluster.name, value: shopmesh }
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms{{ $es.heap }} -Xmx{{ $es.heap }}" }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: 9200 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket: { port: 9200 }
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            {{- toYaml $es.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          {{- if $es.persistence.enabled }}
          persistentVolumeClaim:
            claimName: elasticsearch-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "shopmesh.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - { name: http, port: 9200 }
{{- end }}
