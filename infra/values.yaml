# ShopMesh - configuration. One flat chart, same conventions as devops-platform-v1.

# ---------------------------------------------------------------------------
# Gateway API - defined ONCE, used by every route in templates/httproutes.yaml
# Each route only picks its own subdomain: <subdomain>.<domain>
# (values copied from the previous cluster - verify them for the NEW cluster:
#  node public IP for nip.io + the Gateway's NodePort)
# ---------------------------------------------------------------------------
gateway:
  name: main-gateway
  namespace: default
  domain: 3.108.88.140.nip.io
  nodePort: 32136          # only used to print URLs in the install notes

global:
  imageRegistry: rwxatharv          # Docker Hub user
  imageTag: "v12"
  imagePullPolicy: IfNotPresent

# Secrets live in the Secret "shopmesh-secrets" (create with: make secrets).
# Chart-generated secrets are NOT used by default because Argo CD renders with
# `helm template`, where lookup/randAlphaNum would change on every sync.
secrets:
  create: true
  # only used when create=true (quick local tests)
  postgresPassword: change-me-postgres
  jwtSecret: change-me-jwt-secret
  rabbitmqUser: shop
  rabbitmqPassword: change-me-rabbit

config:
  postgresUser: postgres

defaultResources:
  requests: { cpu: 50m, memory: 96Mi }
  limits:   { cpu: 300m, memory: 256Mi }

# ---- application services (Deployment + Service generated per entry) ----
services:
  frontend:
    port: 80
    replicas: 1
    route: { enabled: true, subdomain: shop }
    env:
      API_GATEWAY_URL: http://api-gateway:8080
  api-gateway:
    port: 8080
    replicas: 1
    route: { enabled: true, subdomain: api, path: /api }
    env:
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      SHIPPING_SERVICE_URL: http://shipping-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-worker:3005
  user-service:
    port: 3001
    env: { DB_NAME: users }
  product-service:
    port: 3002
    env: { DB_NAME: products }
  order-service:
    port: 3003
    env:
      DB_NAME: orders
      PRODUCT_SERVICE_URL: http://product-service:3002
  payment-service:
    port: 3004
    env:
      PAYMENT_FAILURE_RATE: "0.1"
  notification-worker:
    port: 3005
    env:
      USER_SERVICE_URL: http://user-service:3001
  shipping-service:
    port: 3006
    env:
      STEP_SEC: "10"          # demo: seconds between tracking stages

# ---- data stores / broker ----
postgres:
  image: postgres:16-alpine
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""       # empty = cluster default (local-path)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

rabbitmq:
  image: rabbitmq:3.13-management-alpine
  route: { enabled: true, subdomain: rabbitmq }   # management UI (port 15672)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ---- public access via Cloudflare Tunnel (runs in cluster) ----
cloudflared:
  enabled: false
  image: cloudflare/cloudflared:latest
  useToken: false                       # true = named tunnel with fixed hostname (needs secret cloudflared-token)
  targetUrl: http://frontend:80         # quick-tunnel target

# ---------------------------------------------------------------------------
# ELK + Filebeat (centralised logs) - every block has its own true/false
#   Filebeat (DaemonSet) -> Logstash -> Elasticsearch -> Kibana
#   elk.enabled: false            => NOTHING below is rendered
#   elk.logstash.enabled: false   => Filebeat ships straight to Elasticsearch (saves ~1Gi RAM)
#   elk.kibana.route.enabled      => expose Kibana at kibana.<gateway.domain> (no login! see README)
# With everything ON keep ~4 GB of free RAM on the node.
# Enable:  helm upgrade --install ... --set elk.enabled=true   (or make deploy ELK=true)
# ---------------------------------------------------------------------------
elk:
  enabled: false                 # MASTER SWITCH
  version: "8.15.3"              # one version for Elasticsearch / Logstash / Kibana / Filebeat
  elasticsearchUrl: http://elasticsearch:9200   # change only if elasticsearch.enabled=false (external ES)
  indexPrefix: shopmesh-logs     # indices: shopmesh-logs-YYYY.MM.dd
  retentionDays: 7               # old log indices are deleted automatically (ILM)

  elasticsearch:
    enabled: true
    heap: 512m
    sysctlInit: true             # privileged init container for vm.max_map_count (set false if pods can't be privileged)
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ""       # empty = cluster default (local-path)
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits:   { cpu: "1", memory: 1536Mi }

  logstash:
    enabled: true
    heap: 256m
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 1Gi }

  kibana:
    enabled: true
    route: { enabled: true, subdomain: kibana }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 1Gi }

  filebeat:
    enabled: true
    namespaceOnly: true          # only collect logs of this release's namespace
    excludeContainers: [filebeat, logstash, elasticsearch, kibana, elk-setup]
    mountDockerLogs: false       # true only on nodes that use the docker runtime (not containerd/k3s)
    resources:
      requests: { cpu: 50m, memory: 100Mi }
      limits:   { cpu: 200m, memory: 200Mi }

  setup:
    enabled: true                # post-install Job: retention policy, replicas=0 template, Kibana data view
