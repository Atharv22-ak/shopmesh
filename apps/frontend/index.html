:root{--nav:#131921;--nav2:#232f3e;--or:#ff9900;--yl:#ffd814;--or2:#ffa41c;--lk:#007185;--pr:#b12704}

a{color:var(--lk);text-decoration:none;cursor:pointer}a:hover{color:#c7511f;text-decoration:underline}
header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;z-index:9}
.logo{font-size:24px;font-weight:700;color:#fff;padding:4px 8px}.logo b{color:var(--or)}.logo:hover,.hb:hover{color:#fff;text-decoration:none;outline:1px solid #fff}
.hb{color:#fff;padding:4px 8px;font-size:12px;line-height:1.2;cursor:pointer;white-space:nowrap}.hb b{display:block;font-size:14px}
.search{flex:1;display:flex;height:40px;border-radius:4px;overflow:hidden;min-width:0}.search select{background:#e6e6e6;border:0;padding:0 6px;max-width:120px}
.search input{flex:1;border:0;padding:0 10px;font-size:15px;min-width:0}.search button{background:var(--or2);border:0;width:46px;font-size:18px;cursor:pointer}
.cnt{color:var(--or);font-size:16px;font-weight:700}
.sub{background:var(--nav2);padding:6px 12px;display:flex;gap:14px;overflow-x:auto}.sub a{color:#fff;white-space:nowrap;padding:3px 6px}
main{max-width:1500px;margin:0 auto;padding:0 14px 30px}
.hero{height:440px;margin:0 -14px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4% 150px;color:#fff}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:120px;background:linear-gradient(transparent,#eaeded)}
.hero h1{font-size:clamp(22px,4vw,42px);margin:0 0 8px}.hero .e{font-size:clamp(70px,14vw,150px)}.hero button.a{z-index:2;background:rgba(0,0,0,.25);color:#fff;border:0;font-size:34px;height:120px;width:40px;cursor:pointer}
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:-150px;position:relative;z-index:2}
.box{background:#fff;padding:16px;border-radius:2px}.box h3,.box h2{margin:0 0 10px;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;font-size:12px}.tiles .t{background:#f7f8f8;height:80px;display:grid;place-items:center;font-size:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pc{border:1px solid #e7e7e7;padding:12px;display:flex;flex-direction:column;gap:4px;background:#fff}.img{background:#f7f8f8;height:160px;display:grid;place-items:center;font-size:72px;cursor:pointer}
.pn{color:#0f1111;font-size:15px}.star{color:var(--or2);letter-spacing:1px}.pr{font-size:22px}.pr small{font-size:12px;vertical-align:top}.mrp{color:#565959;text-decoration:line-through;font-size:12px}.off{color:#cc0c39}.ok{color:#007600;font-size:18px}.no{color:#b12704;font-size:18px}
.b{border:1px solid #d5d9d9;border-radius:20px;padding:8px 14px;cursor:pointer;font-size:13px;width:100%;background:#fff}.by{background:var(--yl);border-color:#fcd200}.by:hover{background:#f7ca00}.bo{background:var(--or2);border-color:#ff8f00}.bo:hover{background:#fa8900}.b:disabled{opacity:.5}
.dt{display:grid;grid-template-columns:minmax(200px,1fr) 1.4fr 280px;gap:24px;margin-top:16px}.big{background:#f7f8f8;display:grid;place-items:center;font-size:150px;min-height:300px}
.buy{border:1px solid #d5d9d9;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start}
.cl,.sl{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px;align-items:start}.sl{grid-template-columns:200px 1fr}
.ci{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #ddd}.ci .e{background:#f7f8f8;width:110px;height:110px;display:grid;place-items:center;font-size:54px;flex:none}
select,input.f,textarea{padding:7px;border:1px solid #888;border-radius:3px;font:inherit}input.f,textarea{width:100%;margin:3px 0 10px}
.auth{max-width:350px;margin:30px auto;border:1px solid #ddd;border-radius:8px;background:#fff;padding:20px}.auth h1{font-size:28px;margin:0 0 12px}
.bd{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}.PAID{background:#dcfce7;color:#166534}.PENDING{background:#fef3c7;color:#92400e}.PAYMENT_FAILED{background:#fee2e2;color:#991b1b}
.top{background:#37475a;color:#fff;text-align:center;padding:14px;cursor:pointer}footer{background:var(--nav2);color:#ddd;text-align:center;padding:24px;font-size:12px}
#toast{position:fixed;right:16px;bottom:16px;z-index:20}.t2{background:#111;color:#fff;padding:10px 16px;margin-top:8px;border-radius:6px}.t2.err{background:#c40000}
@media(max-width:900px){.dt,.cl,.sl{grid-template-columns:1fr}.hd{display:none}}

/* ---- UI polish ---- */
:root{--r:12px;--sh:0 1px 2px rgba(15,17,17,.08),0 4px 14px rgba(15,17,17,.06);--sh2:0 10px 30px rgba(15,17,17,.18)}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(#e3e6e6,#f3f4f6 420px) fixed;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(90deg,#0f141a,#1b2838);box-shadow:0 2px 12px rgba(0,0,0,.35)}
.search{border-radius:10px;box-shadow:0 0 0 0 transparent;transition:box-shadow .2s}.search:focus-within{box-shadow:0 0 0 3px var(--or)}
.sub a{border-radius:4px;transition:background .15s}.sub a:hover{background:rgba(255,255,255,.14);text-decoration:none}
.box{border-radius:var(--r);box-shadow:var(--sh)}
.pc{border-radius:var(--r);border-color:#eceff1;transition:transform .2s,box-shadow .2s}.pc:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.img{position:relative;border-radius:10px;background:linear-gradient(135deg,#f7f8f8,#e6edf4);transition:transform .25s}.pc:hover .img{transform:scale(1.03)}
.badge{position:absolute;top:8px;left:8px;background:#cc0c39;color:#fff;font:700 12px/1 system-ui,sans-serif;padding:5px 8px;border-radius:6px}
.low{color:#b12704;font-weight:600}
.b{transition:transform .12s,background .15s,box-shadow .15s}.b:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}.b:active{transform:none}
.hero:before{content:"";position:absolute;width:440px;height:440px;right:8%;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.hero>div{animation:fade .5s both}
.ci{transition:background .15s}.ci:hover{background:#fafafa}
.top{transition:background .15s}.top:hover{background:#485769}
.t2{box-shadow:var(--sh2);animation:slide .25s both}
.cnt.bump{animation:bump .3s}
.sk{height:300px;border-radius:var(--r);background:linear-gradient(90deg,#e8eaea 25%,#f6f7f7 37%,#e8eaea 63%);background-size:400% 100%;animation:shine 1.3s infinite}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.5)}}
@keyframes shine{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Enhanced styles for new features */
.img-container {
  position: relative;
  height: 0;
  padding-bottom: 66.67%; /* 3:4 ratio */
  overflow: hidden;
  border-radius: var(--r);
  margin-bottom: 10px;
}
.img-container img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}
.pc:hover .img-container img {
  transform: scale(1.05);
}
.badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: #cc0c39;
  color: white;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}
.badge.new { background: #28a745; }
.badge.bestseller { background: #ffc107; color: #212529; }
.badge.trending { background: #dc3545; }
.discount-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #28a745;
  color: white;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
}
.wishlist-btn, .compare-btn {
  position: absolute;
  top: 8px;
  background: rgba(255,255,255,0.9);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s ease;
  z-index: 10;
}
.wishlist-btn { right: 40px; }
.compare-btn { right: 8px; }
.wishlist-btn:hover, .compare-btn:hover {
  background: rgba(255,255,255,1);
  transform: scale(1.1);
}
.wishlist-btn.active { color: #e74c3c; }
.compare-btn.active { color: #3498db; }
.stock.low { color: #e74c3c; font-weight: bold; }

/* Enhanced product detail styles */
.product-images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
  margin: 20px 0;
}
.product-images img {
  height: 120px;
  object-fit: cover;
  border-radius: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s ease;
}
.product-images img.active,
.product-images img:hover {
  border-color: var(--or);
  transform: scale(1.05);
}
.share-buttons {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
.share-buttons button {
  background: rgba(255,255,255,0.9);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s ease;
}
.share-buttons button:hover {
  background: rgba(255,255,255,1);
  transform: scale(1.1);
}
.product-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}

/* Recently viewed section */
.recently-viewed-section {
  background: #f8f9fa;
  padding: 20px;
  border-radius: var(--r);
  margin-bottom: 20px;
}
.recently-viewed-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 15px 0;
}
.recently-viewed-header button {
  background: none;
  border: 1px solid var(--or);
  color: var(--or);
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
.recently-viewed-header button:hover {
  background: var(--or);
  color: white;
}
.recently-viewed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.wishlist-empty {
  text-align: center;
  padding: 20px;
  color: #666;
  font-style: italic;
}

/* Comparison styles */
.comparison-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.comparison-modal.active {
  display: flex;
}
.comparison-content {
  background: white;
  border-radius: 8px;
  max-width: 1200px;
  width: 90%;
  max-height: 90vh;
  overflow: hidden;
}
.comparison-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  border-bottom: 1px solid #eee;
}
.comparison-header h2 {
  margin: 0;
}
.comparison-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
}
.comparison-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}
.comparison-table th,
.comparison-table td {
  padding: 20px;
  text-align: left;
  border-bottom: 1px solid #eee;
}
.comparison-table th {
  background: #f8f9fa;
  font-weight: 600;
  position: sticky;
  top: 0;
}
.comparison-table tr:hover td {
  background: #f8f9fa;
}
.spec-row {
  background: #f8f9fa;
}
.spec-label {
  font-weight: 600;
  color: #666;
}
.spec-value {
  font-weight: normal;
}

/* Cart enhancements */
#free-shipping-bar {
  background: #f8f9fa;
  border-radius: 4px;
  padding: 15px;
  margin: 20px 0;
  text-align: center;
  font-size: 14px;
}
#free-shipping-bar .shipping-progress {
  height: 8px;
  background: #ffc107;
  border-radius: 4px;
  margin-top: 8px;
  transition: width 0.3s ease;
}
#cart-actions {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}
#cart-actions .b {
  flex: 1;
  min-width: 120px;
}

/* Image viewer modal */
.image-viewer-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.image-viewer-modal.active {
  display: flex;
}
.image-viewer-content {
  text-align: center;
  position: relative;
}
.image-viewer-content img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.image-viewer-content .image-caption {
  margin-top: 15px;
  color: white;
  font-size: 18px;
}
.image-viewer-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  font-size: 28px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.image-viewer-close:hover {
  background: rgba(255,255,255,0.3);
}

.Product thumb in cart */
.product-thumb {
  width: 80px;
  height: 80px;
  overflow: hidden;
  border-radius: 4px;
  margin-right: 15px;
}
.product-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Wishlist page styles */
.wishlist-empty {
  text-align: center;
  padding: 40px 20px;
  color: #666;
}
.wishlist-empty ion-icon {
  font-size: 48px;
  margin-bottom: 20px;
  color: #ddd;
}

/* Product badges in category tiles */
.home-tile-badge {
  position: absolute;
  top: 5px;
  left: 5px;
  background: rgba(0,0,0,0.5);
  color: white;
  font-size: 10px;
  padding: 2px 4px;
  border-radius: 3px;
}

/* Enhanced loading skeletons */
.sk {
  background: #f7f8f8;
  height: 300px;
  border-radius: var(--r);
  animation: shine 1.3s infinite;
}
@keyframes shine {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .recently-viewed-grid,
  .wishlist-grid,
  .product-images {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  }
  .comparison-table th,
  .comparison-table td {
    padding: 15px;
    font-size: 14px;
  }
  .comparison-table th.spec-label,
  .comparison-table td.spec-label {
    width: 150px;
  }
  #cart-actions {
    flex-direction: column;
  }
  #cart-actions .b {
    width: 100%;
  }
}

  const a=JSON.parse(localStorage.addr||'{}'),fee=sub()>=50000?0:4000;
  $('view').innerHTML=`<div class="cl"><div class="box"><h2>Checkout</h2><b>1. Delivery address</b><br><br>
  <input class="f" id="an" placeholder="Full name" value="${esc(a.n)}"><input class="f" id="ap" placeholder="Mobile number" value="${esc(a.p)}">
  <textarea id="aa" rows="3" placeholder="Flat, house no., street, city, state">${esc(a.a)}</textarea><input class="f" id="az" placeholder="Pincode" value="${esc(a.z)}">
  <b>2. Payment method</b><p>💳 Demo payment (simulated by payment-service, ~10% fail)</p><b>3. Review items</b>
  ${Object.keys(C).map(i=>{const p=pid(i);return p?`<div style="padding:6px 0">${p.emoji} ${esc(p.name)} × ${C[i]} — <b>${inr(p.price_cents*C[i])}</b></div>`:''}).join('')}</div>
  <div class="box"><button class="b by" data-a="place">Place your order</button><h3 style="font-size:16px">Order Summary</h3>
  <div>Items: ${inr(sub())}</div><div>Delivery: ${fee?inr(fee):'FREE'}</div><hr><b style="color:var(--pr);font-size:18px">Order Total: ${inr(sub()+fee)}</b><p><small>Delivery fee is shown for display only; charged total = items.</small></p></div></div>`;}

function track(t){if(!t)return'';const S=['LABEL_CREATED','PICKED_UP','IN_TRANSIT','OUT_FOR_DELIVERY','DELIVERED'],L=['Label created','Picked up','In transit','Out for delivery','Delivered'],i=S.indexOf(t.status);
  return`<div style="margin:10px 0;padding:10px;background:#f7fafa;border:1px solid #e3e6e6;border-radius:8px"><small><b>${esc(t.carrier)}</b> · Tracking <b>${esc(t.trackingNumber)}</b>${t.status!='DELIVERED'?' · ETA '+esc(t.eta):''}</small>
  <div style="display:flex;gap:4px;margin:8px 0">${S.map((x,k)=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:6px;border-radius:3px;background:${k<=i?'#067d62':'#d5d9d9'}"></div>${L[k]}</div>`).join('')}</div>
  ${(t.events||[]).slice().reverse().map(e=>`<div style="font-size:12px;color:#565959">${new Date(e.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} — ${esc(e.note)}</div>`).join('')}</div>`}
async function orders(){if(!token)return location.hash='#/login?next=orders';
  const draw=async()=>{const os=await api('/orders');const trk={};await Promise.all(os.filter(o=>['PAID','SHIPPED','DELIVERED'].includes(o.status)).map(async o=>{try{trk[o.id]=await api('/shipments/'+o.id)}catch{}}));$('ol').innerHTML=os.length?os.map(o=>`<div class="box" style="margin-bottom:14px;border:1px solid #ddd">
  <div style="display:flex;justify-content:space-between;background:#f0f2f2;margin:-16px -16px 12px;padding:12px 16px;flex-wrap:wrap;gap:8px"><span>ORDER PLACED<br>${new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span><span>TOTAL<br>${inr(o.total_cents)}</span><span>ORDER # ${o.id}</span></div>
  <span class="bd ${esc(o.status)}">${esc(o.status.replace('_',' '))}</span>${o.status=='PAID'?` <small>Arriving ${eta()}</small>`:''}${o.address?`<div><small>Ship to: ${esc(o.address)}</small></div>`:''}${track(trk[o.id])}
  ${(o.items||[]).map(i=>`<div style="padding:8px 0">${pid(i.productId)?.emoji||'📦'} <a href="#/p/${i.productId}">${esc(i.name)}</a> × ${i.qty}</div>`).join('')}</div>`).join(''):'<div class="box">You have no orders yet.</div>'};
  $('view').innerHTML='<h2 style="margin-top:16px">Your Orders</h2><div id="ol"></div>';await draw();oT=setInterval(guard(draw),3000);}

function login(q){const next=q.get('next')||'',reg=q.get('r');
  $('view').innerHTML=`<div class="auth"><h1>${reg?'Create account':'Sign in'}</h1>${token?'<p>You are signed in.</p><button class="b" data-a="out">Sign out</button>':`
  ${reg?'<b>Your name</b><input class="f" id="ln">':''}<b>Email</b><input class="f" id="le" type="email"><b>Password</b><input class="f" id="lp" type="password">
  <button class="b by" data-a="${reg?'reg':'log'}" data-next="${esc(next)}">${reg?'Create your account':'Continue'}</button>
  <p><small>${reg?'Already a customer?':'New to ShopMesh?'}</small> <a href="#/login?${reg?'':'r=1&'}next=${esc(next)}">${reg?'Sign in':'Create your account'}</a></p>`}</div>`;}

async function render(){clearInterval(oT);clearInterval(hT);scrollTo(0,0);
  const[path,qs]=(location.hash.slice(1)||'/').split('?'),q=new URLSearchParams(qs||'');
  try{if(path.startsWith('/p/'))product(path.slice(3));
    else if(path === '/wishlist') await showWishlist();
    else if(path === '/comparison') await showComparison();
    else ({'/search':search,'/cart':cartV,'/checkout':checkout,'/orders':orders,'/login':login}[path]||home)(q)
  }catch(e){toast(e.message,1)}}

async function signin(email,password,next){const r=await send('POST','/auth/login',{email,password});
  token=r.token;uname=r.user.name||email.split('@')[0];localStorage.token=token;localStorage.uname=uname;await loadCart();location.hash='#/'+next;toast('Welcome, '+uname)}
const G=guard(async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,add=async(i,n)=>{if(!token){location.hash='#/login';throw new Error('Please sign in first')}C=await send('POST','/cart/items',{productId:+i,qty:n});chrome()};
  if(a=='hs')window.hs(+t.dataset.n);
  if(a=='add'){await add(id,+($('qty')?.value||1));toast('Added to Cart ✔')}
  if(a=='buy'){await add(id,+$('qty').value);location.hash='#/checkout'}
  if(a=='del'){C=await send('DELETE','/cart/items/'+id);chrome();cartV()}
  if(a=='clr'){await send('DELETE','/cart');C={};chrome();cartV()}
  if(a=='out')out();
  if(a=='log')await signin($('le').value.trim(),$('lp').value,t.dataset.next);
  if(a=='reg'){await send('POST','/auth/register',{name:$('ln').value.trim(),email:$('le').value.trim(),password:$('lp').value});await signin($('le').value.trim(),$('lp').value,t.dataset.next)}
  if(a=='place'){const ad={n:$('an').value.trim(),p:$('ap').value.trim(),a:$('aa').value.trim(),z:$('az').value.trim()};
    if(!ad.n||!/^\d{10}$/.test(ad.p)||!ad.a||!/^\d{6}$/.test(ad.z))throw new Error('Enter name, 10-digit mobile, address and 6-digit pincode');
    localStorage.addr=JSON.stringify(ad);const o=await send('POST','/checkout',{address:`${ad.n}, ${ad.a} - ${ad.z}, Ph: ${ad.p}`});
    C={};chrome();toast('Order #'+o.id+' placed!');location.hash='#/orders'}});
document.body.addEventListener('click',G);
document.body.addEventListener('change',guard(async e=>{const t=e.target;if(t.dataset.a!='qty')return;C=await send('PUT','/cart/items',{productId:+t.dataset.id,qty:+t.value});chrome();cartV()}));
$('sf').onsubmit=e=>{e.preventDefault();location.hash='#/search?'+new URLSearchParams({q:$('sq').value,c:$('sc').value})};
window.onhashchange=render;
// Initialize storage and load data
initStorage();
guard(async()=>{P=await api('/products');head();await loadCart().catch(()=>{});await render()})();

// Enhanced functionality handlers
async function toggleWishlist(productId) {
  if (isInWishlist(productId)) {
    removeFromWishlist(productId);
  } else {
    addToWishlist(productId);
  }
  // Update UI if on wishlist page
  if (location.hash.includes('#/wishlist')) {
    await showWishlist();
  }
  // Update all wishlist buttons
  document.querySelectorAll('.wishlist-btn[data-id="'+productId+'"]').forEach(btn => {
    btn.classList.toggle('active', isInWishlist(productId));
  });
}

async function toggleComparison(productId) {
  if (isInComparison(productId)) {
    removeFromComparison(productId);
  } else {
    addToComparison(productId);
  }
  // Update UI if on comparison page
  if (location.hash.includes('#/comparison')) {
    await showComparison();
  }
  // Update all comparison buttons
  document.querySelectorAll('.compare-btn[data-id="'+productId+'"]').forEach(btn => {
    btn.classList.toggle('active', isInComparison(productId));
  });
}

async function showWishlist() {
  const wishlist = getWishlist();
  if (wishlist.length === 0) {
    $('view').innerHTML = `
      <div class="wishlist-empty">
        <ion-icon name="heart-outline"></ion-icon>
        <p>Your wishlist is empty</p>
        <a href="#/" class="b by">Continue shopping</a>
      </div>`;
    return;
  }

  // Fetch products for wishlist (simplified - in reality you'd make API calls)
  const wishlistProducts = P.filter(p => wishlist.includes(p.id));

  $('view').innerHTML = `
    <div class="box">
      <h2>My Wishlist (${wishlist.length})</h2>
      <div class="grid">${wishlistProducts.map(p => `<div class="pc" data-id="${p.id}">
        <div class="img-container">
          <img src="${getProductImage(p.emoji, p.name)}" alt="${esc(p.name)}" loading="lazy">
          <button class="wishlist-btn active" data-a="wishlist-toggle" data-id="${p.id}" title="Remove from Wishlist">♡</button>
          <button class="compare-btn ${isInComparison(p.id)?'active':''}" data-a="compare-toggle" data-id="${p.id}" title="Compare">↔</button>
        </div>
        <a class="pn" href="#/p/${p.id}">${esc(p.name)}</a>
        <div><span class="star">${stars(p.rating)}</span> <a>${p.reviews.toLocaleString('en-IN')}</a></div>
        ${price(p)}
        <small>FREE delivery by ${eta()}</small>
        <button class="b by" data-a="add" data-id="${p.id}" ${p.stock?'':'disabled'}>Add to Cart</button>
      </div>`).join('')}</div>
      ${wishlist.length > 0 ? `<div style="text-align:right;margin-top:10px"><button class="b by" data-a="clear-wishlist">Clear Wishlist</button></div>` : ''}
    </div>`;
}

async function showComparison() {
  const comparison = getComparison();
  if (comparison.length === 0) {
    toast('No products selected for comparison');
    return;
  }

  const comparisonProducts = P.filter(p => comparison.includes(p.id));

  // Create modal
  let modalExists = document.querySelector('.comparison-modal');
  if (!modalExists) {
    modalExists = document.createElement('div');
    modalExists.className = 'comparison-modal';
    document.body.appendChild(modalExists);
  }

  modalExists.innerHTML = `
    <div class="comparison-content">
      <div class="comparison-header">
        <h2>Product Comparison</h2>
        <button class="comparison-close" data-a="close-comparison">&times;</button>
      </div>
      <table class="comparison-table">
        <thead>
          <tr>
            <th>Feature</th>
            ${comparisonProducts.map(p => `<th>${esc(p.name)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr class="spec-row">
            <td class="spec-label">Price</td>
            ${comparisonProducts.map(p => `<td class="spec-value">${inr(p.price_cents)} ${p.mrp_cents>p.price_cents?`<span class="mrp">M.R.P: ${inr(p.mrp_cents)}</span> <span class="off">(${disc(p)}% off)</span>`:''}</td>`).join('')}
          </tr>
          <tr>
            <td class="spec-label">Rating</td>
            ${comparisonProducts.map(p => `<td class="spec-value"><span class="star">${stars(p.rating)}</span> ${p.reviews.toLocaleString('en-IN')} reviews</td>`).join('')}
          </tr>
          <tr class="spec-row">
            <td class="spec-label">Stock Availability</td>
            ${comparisonProducts.map(p => `<td class="spec-value">${p.stock>0?`<span class="ok">In Stock (${p.stock} available)</span>`:`<span class="no">Out of Stock</span>`}</td>`).join('')}
          </tr>
          <tr>
            <td class="spec-label">Category</td>
            ${comparisonProducts.map(p => `<td class="spec-value"><a href="#/search?c=${encodeURIComponent(p.category)}">${esc(p.category)}</a></td>`).join('')}
          </tr>
          <tr class="spec-row">
            <td class="spec-label">Description</td>
            ${comparisonProducts.map(p => `<td class="spec-value">${esc(p.description)}</td>`).join('')}
          </tr>
        </tbody>
      </table>
      <div style="padding: 20px; text-align: center;">
        <button class="b by" data-a="add-all-to-cart">Add All to Cart</button>
        <button class="b bo" data-a="clear-comparison">Clear Comparison</button>
      </div>
    </div>`;

  modalExists.classList.add('active');
}

async function clearRecentlyViewed() {
  localStorage.setItem(STORAGE_KEYS.RECENTLY_VIEWED, JSON.stringify([]));
  // Update UI if on homepage
  if (!location.hash || location.hash === '#/') {
    await render();
  }
}

async function shareProduct(productId) {
  const product = pid(productId);
  if (!product) return;

  const shareText = `Check out ${esc(product.name)} on ShopMesh! ${inr(product.price_cents)}`;
  // Using Web Share API if available, fallback to prompt
  if (navigator.share) {
    try {
      await navigator.share({
        title: esc(product.name),
        text: shareText,
        url: window.location.origin + '#/p/' + productId
      });
      toast('Shared successfully!');
    } catch (err) {
      // Fallback
      navigator.clipboard.writeText(shareText);
      toast('Link copied to clipboard!');
    }
  } else {
    navigator.clipboard.writeText(shareText);
    toast('Link copied to clipboard!');
  }
}

async function viewProductImage(productId) {
  const product = pid(productId);
  if (!product) return;

  // Create image viewer modal
  let modal = document.querySelector('.image-viewer-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.className = 'image-viewer-modal';
    document.body.appendChild(modal);
  }

  modal.innerHTML = `
    <div class="image-viewer-content">
      <button class="image-viewer-close" data-a="close-image-viewer">&times;</button>
      <img src="${getProductImage(product.emoji, product.name)}" alt="${esc(product.name)}" style="max-width: 90vw; max-height: 90vh;">
      <div class="image-caption">${esc(product.name)}</div>
    </div>`;

  modal.classList.add('active');
}

async function clearWishlist() {
  localStorage.setItem(STORAGE_KEYS.WISHLIST, JSON.stringify([]));
  await showWishlist();
  toast('Wishlist cleared');
}

async function addAllToCart() {
  if (!token) {
    location.hash = '#/login';
    return;
  }

  const comparison = getComparison();
  if (comparison.length === 0) {
    toast('No products in comparison to add to cart');
    return;
  }

  try {
    const comparisonProducts = P.filter(p => comparison.includes(p.id));
    for (const product of comparisonProducts) {
      await send('POST', '/cart/items', { productId: product.id, qty: 1 });
    }
    await loadCart();
    toast('All compared products added to cart');
    clearComparison();
  } catch (error) {
    toast('Error adding products to cart: ' + error.message);
  }
}

// Extended event listener for enhanced functionality
document.body.addEventListener('click', guard(async e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a;
  const id = t.dataset.id;

  switch (a) {
    case 'wishlist-toggle':
      await toggleWishlist(id);
      toast(isInWishlist(id) ? 'Added to Wishlist ♡' : 'Removed from Wishlist');
      break;
    case 'compare-toggle':
      await toggleComparison(id);
      toast(isInComparison(id) ? 'Added to Comparison ↔' : 'Removed from Comparison');
      break;
    case 'view-wishlist':
      await showWishlist();
      break;
    case 'view-comparison':
      await showComparison();
      break;
    case 'clear-recently-viewed':
      await clearRecentlyViewed();
      toast('Recently viewed cleared');
      break;
    case 'clear-comparison':
      clearComparison();
      toast('Comparison cleared');
      break;
    case 'share-product':
      await shareProduct(id);
      break;
    case 'view-product-image':
      await viewProductImage(id);
      break;
    case 'close-comparison':
      document.querySelector('.comparison-modal')?.classList.remove('active');
      break;
    case 'close-image-viewer':
      document.querySelector('.image-viewer-modal')?.classList.remove('active');
      break;
    case 'clear-wishlist':
      await clearWishlist();
      break;
    case 'add-all-to-cart':
      await addAllToCart();
      break;
  }
}));
</script></body></html>
